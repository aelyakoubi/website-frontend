# ────────────────────────────────
# Frontend Authentication Flow
# ────────────────────────────────

Frontend
→ Auth0 login popup/redirect
→ OAuth callback
→ POST /auth/oauth-sync
→ Backend returns custom JWT
→ JWT stored in localStorage
→ Frontend uses backend JWT for API requests


# ────────────────────────────────
# Environment Variables (.env)
# ────────────────────────────────

Required:

VITE_AUTH0_DOMAIN=
VITE_AUTH0_CLIENT_ID=
VITE_API_URL=


# ────────────────────────────────
# Notes
# ────────────────────────────────

- Frontend uses Auth0 React SDK for authentication.
- Backend handles authorization and JWT validation.
- React Router routing is handled through:
  public/.htaccess
- Production build is generated using:
  npm run build
- Build output is generated inside:
  /dist
